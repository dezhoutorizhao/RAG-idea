name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q
      - name: Smoke tests
        shell: pwsh
        run: .\scripts\run_smoke.ps1
